org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
# ===== JDK 说明（跨平台，勿写死本机路径）=====
# AGP 8.7.3 要求 JDK 17。请用 JDK17 构建：
#   - 命令行：build_android.sh / build_android.bat 会自动探测 JDK17
#   - Android Studio：Settings → Build Tools → Gradle → Gradle JVM 选 17
# 若你的机器已装 JDK17 且想强制指定，可取消下面注释并改成你的 JDK17 路径：
# org.gradle.java.home=/path/to/your/jdk17
