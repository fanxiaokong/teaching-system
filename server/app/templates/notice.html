{% extends "base.html" %}
{% block title %}{{ title }} · {{ site_title }}{% endblock %}
{% block content %}
<div class="card center-card">
  <div class="result-icon">i</div>
  <h2>{{ title }}</h2>
  <p class="muted">{{ message }}</p>
  <div class="row center-row">
    <a class="btn btn-primary" href="{{ url_for('main.home') }}">返回首页</a>
    {% if user %}<a class="btn btn-ghost" href="{{ url_for('main.me') }}">用户中心</a>{% endif %}
  </div>
</div>
{% endblock %}
