{% extends "base.html" %}
{% block title %}发新帖 · {{ site_title }}{% endblock %}
{% block content %}

<div class="section-head">
  <h2 class="section-title">发新帖</h2>
  <a class="section-more" href="{{ url_for('main.community') }}">← 返回社区</a>
</div>

<div class="card narrow" style="margin:0 auto">
  <form method="post" class="form mt-0">
    <div class="field">
      <label for="title">标题 <span class="req">*</span></label>
      <input id="title" name="title" required maxlength="80" placeholder="一句话说清你的问题或分享">
    </div>
    <div class="field">
      <label for="content">内容 <span class="req">*</span></label>
      <textarea id="content" name="content" rows="9" required
                placeholder="把你遇到的问题、做过的尝试、报错信息都写清楚，别人更容易帮到你"></textarea>
    </div>
    <div class="row">
      <button class="btn btn-primary btn-lg" type="submit">发布</button>
      <a class="btn btn-ghost btn-lg" href="{{ url_for('main.community') }}">取消</a>
    </div>
  </form>
</div>

{% endblock %}
